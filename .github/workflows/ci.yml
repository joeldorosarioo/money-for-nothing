name: Verify
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:assets
      - run: npm run build
      - run: npm run test:e2e -- --workers=2

      - uses: actions/upload-artifact@v4
        if: failure()

        with:
          name: browser-evidence
          path: |
            playwright-report
            test-results
          retention-days: 7
